<script>
// ============================================================
// AUTENTICAÇÃO
// ============================================================
let isSignup = false;

document.getElementById('authToggleBtn').addEventListener('click', () => {
  isSignup = !isSignup;
  document.getElementById('authTitle').textContent = isSignup ? 'Criar conta' : 'Entrar';
  document.getElementById('authSubmitBtn').textContent = isSignup ? 'Criar conta' : 'Entrar';
  document.getElementById('authToggleText').textContent = isSignup ? 'Já tem conta?' : 'Ainda não tem conta?';
  document.getElementById('authToggleBtn').textContent = isSignup ? 'Entrar' : 'Criar conta';
});

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.classList.add('hidden');

  const { error } = isSignup
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });

  if (error) {
    errEl.textContent = error.message;
    errEl.classList.remove('hidden');
    return;
  }
  if (isSignup) {
    errEl.textContent = 'Conta criada! Verifique seu e-mail para confirmar (se a confirmação estiver ativa) e faça login.';
    errEl.classList.remove('hidden');
    errEl.classList.remove('text-red-600');
    errEl.classList.add('text-green-600');
  }
});

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('flex');
    document.getElementById('userEmail').textContent = session.user.email;
    loadAll();
  }
});

// ============================================================
// NAVEGAÇÃO
// ============================================================
const titles = { dashboard:'Dashboard', carteira:'Carteira de Clientes', onboarding:'Kanban de Onboarding', risco:'Gestão de Risco' };
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    document.getElementById('pageTitle').textContent = titles[btn.dataset.view];
  });
});

// ============================================================
// HELPERS
// ============================================================
const HEALTH_STYLES = {
  'Saudável':          { dot:'#16a34a', bg:'bg-green-50',  text:'text-green-700',  chart:'#22c55e' },
  'Em Alerta':         { dot:'#d97706', bg:'bg-amber-50',  text:'text-amber-700',  chart:'#f59e0b' },
  'Em Risco':          { dot:'#dc2626', bg:'bg-red-50',    text:'text-red-700',    chart:'#ef4444' },
  'Retenção de Churn': { dot:'#991b1b', bg:'bg-red-100',   text:'text-red-800',    chart:'#b91c1c' },
  'Não avaliado':      { dot:'#94a3b8', bg:'bg-slate-100', text:'text-slate-500',  chart:'#cbd5e1' }
};
function healthBadge(score) {
  const s = HEALTH_STYLES[score] || HEALTH_STYLES['Não avaliado'];
  return `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${s.bg} ${s.text}">
            <span style="width:8px;height:8px;border-radius:99px;background:${s.dot};margin-right:6px;display:inline-block;"></span>${score || 'Não avaliado'}
          </span>`;
}
function formatBRL(n) { return (n || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 }); }
function closeModal() { document.getElementById('modalRoot').classList.add('hidden'); }
function openModal(html, maxW = 'max-w-md') {
  const card = document.getElementById('modalCard');
  card.className = `bg-white rounded-2xl shadow-xl w-full ${maxW} p-6 max-h-[90vh] overflow-y-auto transition-all`;
  card.innerHTML = html;
  document.getElementById('modalRoot').classList.remove('hidden');
}
function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = `fixed bottom-6 right-6 z-[60] px-4 py-3 rounded-lg shadow-lg text-sm text-white ${isError ? 'bg-red-600' : 'bg-slate-900'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============================================================
// DATA STATE
// ============================================================
let clientesCache = [];

async function loadAll() {
  await loadClientes();
  await Promise.all([renderDashboard(), renderKanban(), renderRisco()]);
}

async function loadClientes() {
  const { data, error } = await sb.from('clientes').select('*').order('razao_social');
  if (error) { toast(error.message, true); return; }
  clientesCache = data || [];
  paintCarteira(clientesCache);
}

// ============================================================
// DASHBOARD
// ============================================================
let healthChartInstance = null;

async function renderDashboard() {
  const totalClientes = clientesCache.length;
  const mrrTotal = clientesCache.reduce((s,c) => s + (Number(c.mrr) || 0), 0);

  const { count: casosAbertos } = await sb.from('casos_criticos').select('*', { count:'exact', head:true }).eq('status','Aberto');

  const dist = { 'Saudável':0, 'Em Alerta':0, 'Em Risco':0, 'Retenção de Churn':0, 'Não avaliado':0 };
  clientesCache.forEach(c => { dist[c.health_score && dist.hasOwnProperty(c.health_score) ? c.health_score : 'Não avaliado']++; });

  const kpis = [
    { label:'Total de Clientes', value: totalClientes, accent:'brand', icon:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z' },
    { label:'MRR Total', value: formatBRL(mrrTotal), accent:'green', icon:'M12 1v22 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6' },
    { label:'Clientes em Risco', value: casosAbertos || 0, accent:'red', icon:'M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z' },
    { label:'Saudáveis', value: dist['Saudável'], accent:'emerald', icon:'M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4 12 14.01l-3-3' }
  ];
  const accentMap = { brand:'bg-brand-50 text-brand-600', green:'bg-emerald-50 text-emerald-600', red:'bg-red-50 text-red-600', emerald:'bg-emerald-50 text-emerald-600' };
  document.getElementById('kpiCards').innerHTML = kpis.map(k => `
    <div class="bg-white rounded-2xl shadow-card border border-slate-100 p-5">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-medium text-slate-500">${k.label}</span>
        <div class="w-8 h-8 rounded-lg ${accentMap[k.accent]} flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="${k.icon}"/></svg>
        </div>
      </div>
      <p class="font-mono text-2xl font-bold text-slate-900">${k.value}</p>
    </div>`).join('');

  const labels = Object.keys(dist).filter(k => dist[k] > 0);
  const values = labels.map(l => dist[l]);
  const colors = labels.map(l => HEALTH_STYLES[l].chart);
  const ctx = document.getElementById('healthChart').getContext('2d');
  if (healthChartInstance) healthChartInstance.destroy();
  healthChartInstance = new Chart(ctx, { type:'doughnut', data:{ labels, datasets:[{ data:values, backgroundColor:colors, borderWidth:0 }] }, options:{ plugins:{ legend:{ display:false } }, cutout:'68%' } });
  document.getElementById('healthLegend').innerHTML = labels.map((l,i) => `
    <div class="flex items-center justify-between">
      <span class="flex items-center gap-2"><span style="width:8px;height:8px;border-radius:99px;display:inline-block;background:${colors[i]}"></span>${l}</span>
      <span class="font-mono font-semibold">${values[i]}</span>
    </div>`).join('');

  const since = new Date(); since.setDate(since.getDate() - 30);
  const { data: atividades } = await sb.from('atividades').select('tipo, data, clientes(razao_social,dominio)').gte('data', since.toISOString().slice(0,10)).order('data', { ascending:false }).limit(20);
  document.getElementById('atividadesList').innerHTML = (atividades || []).map(a => `
    <div class="flex items-center justify-between text-sm border-b border-slate-50 pb-2">
      <div>
        <p class="text-slate-700 font-medium">${a.tipo}</p>
        <p class="text-xs text-slate-400">${a.clientes ? (a.clientes.razao_social || a.clientes.dominio) : ''}</p>
      </div>
      <span class="text-xs text-slate-400 font-mono">${a.data}</span>
    </div>`).join('') || '<p class="text-xs text-slate-400">Nenhuma atividade registrada nos últimos 30 dias.</p>';
}

async function renderKanban() {
  const { data, error } = await sb.from('onboarding').select('*, clientes(dominio,razao_social)').order('created_at');
  if (error) return toast(error.message, true);

  const columns = {};
  (data || []).forEach(r => {
    const key = r.situacao || 'Sem Situação';
    (columns[key] = columns[key] || []).push(r);
  });
  const preferred = ['Integração de Contrato','Em Implantação','Escalado','Concluído'];
  const keys = Object.keys(columns).sort((a,b) => {
    const ia = preferred.indexOf(a), ib = preferred.indexOf(b);
    if (ia===-1 && ib===-1) return a.localeCompare(b);
    if (ia===-1) return 1; if (ib===-1) return -1; return ia-ib;
  });
  const colColors = ['border-t-brand-400','border-t-amber-400','border-t-red-400','border-t-emerald-400'];

  document.getElementById('kanbanBoard').innerHTML = keys.map((key,i) => `
    <div class="kanban-col shrink-0 w-80">
      <div class="flex items-center justify-between mb-3 px-1">
        <h3 class="text-sm font-semibold text-slate-700">${key}</h3>
        <span class="text-xs font-mono bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">${columns[key].length}</span>
      </div>
      <div class="space-y-3 border-t-4 ${colColors[i%colColors.length]} bg-slate-50/50 rounded-b-xl p-2 min-h-[120px]">
        ${columns[key].map(card => `
          <div class="bg-white rounded-xl shadow-card border border-slate-100 p-4">
            <p class="font-medium text-sm text-slate-800 mb-1">${card.clientes ? (card.clientes.razao_social || card.clientes.dominio) : '—'}</p>
            <p class="text-xs text-slate-500 mb-2">${card.etapa || '—'}</p>
            ${card.observacao ? `<p class="text-xs text-slate-400 mb-2 line-clamp-3">${card.observacao}</p>` : ''}
            <select onchange="moveOnboarding('${card.id}', this.value)" class="w-full text-xs border border-slate-200 rounded-lg px-2 py-1.5">
              ${preferred.map(p => `<option value="${p}" ${p===card.situacao?'selected':''}>${p}</option>`).join('')}
            </select>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

async function moveOnboarding(id, situacao) {
  const { error } = await sb.from('onboarding').update({ situacao }).eq('id', id);
  if (error) return toast(error.message, true);
  toast('Etapa atualizada.'); renderKanban();
}

function normalizeStringClean(str) {
  return String(str || '').toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}

function cleanDomain(val) {
  if (!val) return '';
  let str = String(val).trim().toLowerCase();
  str = str.replace(/^https?:\/\//i, '').replace(/^www\./i, '');
  str = str.split('/')[0];
  return str.trim();
}

function cleanMrr(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return isNaN(val) ? 0 : val;
  let str = String(val).trim().replace(/[R$\s]/g, '');
  if (str.includes(',') && str.includes('.')) {
    if (str.lastIndexOf(',') > str.lastIndexOf('.')) {
      str = str.replace(/\./g, '').replace(',', '.');
    } else {
      str = str.replace(/,/g, '');
    }
  } else if (str.includes(',')) {
    str = str.replace(',', '.');
  }
  const n = parseFloat(str);
  return isNaN(n) ? 0 : Math.round(n * 100) / 100;
}

function cleanHealthScore(val) {
  if (!val) return null;
  const str = normalizeStringClean(val);
  if (str.includes('saud')) return 'Saudável';
  if (str.includes('alert')) return 'Em Alerta';
  if (str.includes('risc')) return 'Em Risco';
  if (str.includes('churn') || str.includes('retenc')) return 'Retenção de Churn';
  const directMap = {
    'saudavel': 'Saudável', 'emalerta': 'Em Alerta', 'emrisco': 'Em Risco', 'retencaodechurn': 'Retenção de Churn'
  };
  return directMap[str] || null;
}

function cleanInadimplencia(val) {
  if (!val) return 'Não';
  const str = normalizeStringClean(val);
  if (['sim', 's', 'yes', 'y', 'true', '1', 'inadimplente'].includes(str)) return 'Sim';
  return 'Não';
}

function setupDropZone() {
  const dropZone = document.getElementById('importDropZone');
  const fileInput = document.getElementById('importFileInput');
  if (!dropZone || !fileInput) return;

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('border-brand-500', 'bg-brand-50/40');
  });

  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-brand-500', 'bg-brand-50/40');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('border-brand-500', 'bg-brand-50/40');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      processImportFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files.length > 0) {
      processImportFile(e.target.files[0]);
    }
  });
}

function processImportFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['xlsx', 'xls', 'csv'].includes(ext)) {
    return toast('Formato inválido. Envie um arquivo .xlsx, .xls ou .csv', true);
  }

  importState.fileName = file.name;
  importState.fileSize = file.size;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellDates: true });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      
      const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '', raw: false });

      if (!jsonRows || jsonRows.length === 0) {
        return toast('A planilha selecionada está vazia ou sem linhas de dados.', true);
      }

      // Detect headers
      const headers = Object.keys(jsonRows[0]);
      importState.rawHeaders = headers;
      importState.rawRows = jsonRows;

      // Auto match mappings
      autoMatchHeaders();
      renderImportStep2();
    } catch (err) {
      console.error(err);
      toast('Erro ao processar planilha: ' + err.message, true);
    }
  };
  reader.onerror = () => toast('Erro ao ler arquivo.', true);
  reader.readAsArrayBuffer(file);
}

function autoMatchHeaders() {
  importState.fieldMapping = {};
  const cleanHeaderMap = {};
  importState.rawHeaders.forEach(h => {
    cleanHeaderMap[normalizeStringClean(h)] = h;
  });

  DB_CLIENTE_FIELDS.forEach(field => {
    let matchedHeader = null;
    for (const alias of field.aliases) {
      const cleanAlias = normalizeStringClean(alias);
      if (cleanHeaderMap[cleanAlias]) {
        matchedHeader = cleanHeaderMap[cleanAlias];
        break;
      }
    }
    if (matchedHeader) {
      importState.fieldMapping[field.key] = matchedHeader;
    }
  });
}

function getProcessedRecords() {
  const mapping = importState.fieldMapping;
  const processed = [];
  const invalidRows = [];

  importState.rawRows.forEach((row, idx) => {
    const rawDom = mapping.dominio ? row[mapping.dominio] : '';
    const dom = cleanDomain(rawDom);

    if (!dom) {
      invalidRows.push({ line: idx + 2, reason: 'Domínio ausente ou inválido', raw: row });
      return;
    }

    const item = {
      dominio: dom,
      razao_social: mapping.razao_social && row[mapping.razao_social] ? String(row[mapping.razao_social]).trim() : dom,
      responsavel: mapping.responsavel && row[mapping.responsavel] ? String(row[mapping.responsavel]).trim() : null,
      health_score: mapping.health_score ? cleanHealthScore(row[mapping.health_score]) : null,
      jornada: mapping.jornada && row[mapping.jornada] ? String(row[mapping.jornada]).trim() : 'Onboarding',
      mrr: mapping.mrr ? cleanMrr(row[mapping.mrr]) : 0,
      vertical: mapping.vertical && row[mapping.vertical] ? String(row[mapping.vertical]).trim() : null,
      prioridade: mapping.prioridade && row[mapping.prioridade] ? String(row[mapping.prioridade]).trim() : null,
      cidade: mapping.cidade && row[mapping.cidade] ? String(row[mapping.cidade]).trim() : null,
      uf: mapping.uf && row[mapping.uf] ? String(row[mapping.uf]).trim().toUpperCase().slice(0,2) : null,
      engajamento: mapping.engajamento && row[mapping.engajamento] ? String(row[mapping.engajamento]).trim() : null,
      satisfacao_percebida: mapping.satisfacao_percebida && row[mapping.satisfacao_percebida] ? String(row[mapping.satisfacao_percebida]).trim() : null,
      tempo_contrato: mapping.tempo_contrato && row[mapping.tempo_contrato] ? String(row[mapping.tempo_contrato]).trim() : null,
      inadimplencia: mapping.inadimplencia ? cleanInadimplencia(row[mapping.inadimplencia]) : 'Não',
      ultima_atividade: mapping.ultima_atividade && row[mapping.ultima_atividade] ? String(row[mapping.ultima_atividade]).trim() : null
    };

    processed.push(item);
  });

  return { processed, invalidRows };
}

async function startImportExecution() {
  const { processed } = getProcessedRecords();
  if (!processed || processed.length === 0) {
    return toast('Não há registros válidos para importar.', true);
  }

  // Render Step 3: Loading Progress
  const total = processed.length;
  openModal(`
    <div class="py-8 px-4 text-center">
      <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center animate-spin">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      </div>
      <h3 class="font-bold text-slate-900 text-base mb-1">Importando clientes...</h3>
      <p id="importProgressMsg" class="text-xs text-slate-500 mb-5">Processando registros e salvando no Supabase...</p>
      
      <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden mb-2">
        <div id="importProgressBar" class="bg-brand-600 h-3 rounded-full transition-all duration-200" style="width: 0%"></div>
      </div>
      <p id="importProgressPercent" class="text-xs font-mono font-semibold text-slate-700">0%</p>
    </div>
  `, 'max-w-md');

  const chunkSize = 50;
  let importedCount = 0;
  let errorCount = 0;
  const errors = [];

  for (let i = 0; i < total; i += chunkSize) {
    const chunk = processed.slice(i, i + chunkSize);
    const progress = Math.min(100, Math.round(((i + chunk.length) / total) * 100));

    const bar = document.getElementById('importProgressBar');
    const pct = document.getElementById('importProgressPercent');
    const msg = document.getElementById('importProgressMsg');
    if (bar) bar.style.width = progress + '%';
    if (pct) pct.textContent = `${progress}% (${Math.min(i + chunk.length, total)} de ${total})`;
    if (msg) msg.textContent = `Enviando lote ${Math.floor(i / chunkSize) + 1} de ${Math.ceil(total / chunkSize)}...`;

    try {
      const { error } = importState.upsertMode
        ? await sb.from('clientes').upsert(chunk, { onConflict: 'dominio' })
        : await sb.from('clientes').insert(chunk);

      if (error) {
        console.error('Erro no lote:', error);
        errorCount += chunk.length;
        errors.push(error.message);
      } else {
        importedCount += chunk.length;
      }
    } catch (err) {
      console.error(err);
      errorCount += chunk.length;
      errors.push(err.message);
    }
  }

  // Render Step 4: Finished Summary
  renderImportSummary(total, importedCount, errorCount, errors);
  await loadAll();
}

        Concluir e Ver Carteira
      </button>
    </div>
  `, 'max-w-md');

function exportCarteiraXlsx() {
  if (!clientesCache || clientesCache.length === 0) {
    return toast('Não há clientes na carteira para exportar.', true);
  }

  const exportData = clientesCache.map(c => ({
    "Domínio": c.dominio || '',
    "Razão Social": c.razao_social || '',
    "Responsável": c.responsavel || '',
    "Health Score": c.health_score || '',
    "Jornada": c.jornada || '',
    "MRR": Number(c.mrr) || 0,
    "Vertical": c.vertical || '',
    "Prioridade": c.prioridade || '',
    "Cidade": c.cidade || '',
    "UF": c.uf || '',
    "Engajamento": c.engajamento || '',
    "Satisfação Percebida": c.satisfacao_percebida || '',
    "Tempo de Contrato": c.tempo_contrato || '',
    "Inadimplência": c.inadimplencia || 'Não',
    "Última Atividade": c.ultima_atividade || ''
  }));

  const ws = XLSX.utils.json_to_sheet(exportData);
  const colWidths = [
    { wch: 25 }, { wch: 40 }, { wch: 20 }, { wch: 16 }, { wch: 15 },
    { wch: 12 }, { wch: 16 }, { wch: 12 }, { wch: 18 }, { wch: 6 },
    { wch: 14 }, { wch: 22 }, { wch: 18 }, { wch: 14 }, { wch: 16 }
  ];
  ws['!cols'] = colWidths;

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Carteira");
  
  const today = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `carteira_clientes_${today}.xlsx`);
  toast('Carteira exportada com sucesso!');
}
</script>
